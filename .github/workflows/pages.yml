# Publishes the public site and leaves the LATERAL server out of the
# GitHub Pages artifact. This workflow deploys only after Settings > Pages
# > Source is set to GitHub Actions. Until then, Pages still publishes the
# branch, including serve.py.
name: Publish public site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Leave LATERAL off the public site
        run: |
          rm -f serve.py test_lateral.py requirements.txt render.yaml
          rm -rf .github __pycache__

      - name: Upload the public site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
